# @format

# This workflow builds the java-based components via Maven, then sets up a Node.js build environment and 
# uses it to build and test the React-based web application. Finally, it runs Lighthouse CI to validate 
# performance and accessibility of the web application.

name: Java CI with Maven

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Initialize git submodules for web-ui
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4
          git submodule status --recursive
        shell: bash
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file chat/pom.xml
        env:
          AZURE_AISEARCH_ENDPOINT: ${{ secrets.AZURE_AISEARCH_ENDPOINT }}
          AZURE_AISEARCH_KEY: ${{ secrets.AZURE_AISEARCH_KEY }}
          AZURE_AISEARCH_INDEX_NAME: ${{ secrets.AZURE_AISEARCH_INDEX_NAME }}
          AZURE_AISEARCH_POLICY_INDEX_NAME: ${{ secrets.AZURE_AISEARCH_POLICY_INDEX_NAME }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          REST_SERVICE_ROOT_URL: ${{ secrets.REST_SERVICE_ROOT_URL }}
          MY_ENV_VAR: "http://localhost:3000"
          POSTGRES_CONNECTION_URL: "postgresql://bunkdb.postgres.database.azure.com/sue_plsas?sslmode=require"
          POSTGRES_CONNECTION_USER: "someuser"
          POSTGRES_CONNECTION_PW: "not for real"
          UNIT_TESTING: "1"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven          

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: "25.x"
          cache: yarn
          cache-dependency-path: "yarn.lock"

      - name: Restore Turbo and Yarn caches
        uses: actions/cache@v5
        with:
          path: |
            .turbo/cache
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-turbo-yarn-${{ hashFiles('yarn.lock', 'turbo.json', '.gitmodules', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-yarn-

      - name: Setup kernel for react native, increase watchers
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p
        shell: bash
        working-directory: ./

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          set -euo pipefail
          (
            cd .
            node .yarn/releases/yarn-4.12.0.cjs install --immutable
          )
          (
            cd web-ui
            node .yarn/releases/yarn-4.12.0.cjs install --immutable
          )
          (
            cd web-ui/submodules/sce
            node .yarn/releases/yarn-4.12.0.cjs install --immutable
          )
        shell: bash
        working-directory: ./

      # NOTE: Turbo lint tool depends on typescript build, so this will do both lint and typescript validation.
      - name: Check types and verify no lint hiding in the seat cushions
        working-directory: ./
        run: node .yarn/releases/yarn-4.12.0.cjs lint
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        shell: bash

      - name: Run unit tests
        working-directory: ./
        run: xvfb-run --server-args="-screen 0 1024x768x24" npx turbo run test --filter='@compliance-theater/app...' -- $YARN_TEST_OPTIONS
        shell: bash
        env:
          YARN_IGNORE_PATH: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Build Next.js-based web application and publish build artifacts for Lighthouse CI
        working-directory: ./        
        shell: bash
        env:
          YARN_IGNORE_PATH: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          AZURE_MONITOR_CONNECTION_STRING: ${{ secrets.NEXT_PUBLIC_AZURE_MONITOR_CONNECTION_STRING }}
          AZURE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.NEXT_PUBLIC_AZURE_MONITOR_CONNECTION_STRING }}                    
          NEXT_PUBLIC_DEFAULT_AI_MODEL: ${{ vars.NEXT_PUBLIC_DEFAULT_AI_MODEL }}
          NEXT_PUBLIC_HOSTNAME: ${{ vars.NEXT_PUBLIC_HOSTNAME }}
          NEXT_PUBLIC_LOG_LEVEL_CLIENT: ${{ vars.NEXT_PUBLIC_LOG_LEVEL_CLIENT }}
          NEXT_PUBLIC_FLAGSMITH_API_URL: ${{ vars.NEXT_PUBLIC_FLAGSMITH_API_URL }}
          NEXT_PUBLIC_FLAGSMITH_ENVIRONMENT_ID: ${{ vars.NEXT_PUBLIC_FLAGSMITH_ENVIRONMENT_ID }}
          NEXT_PUBLIC_MUI_LICENSE: ${{ secrets.NEXT_PUBLIC_MUI_LICENSE }}
          NEXT_PUBLIC_AZURE_MONITOR_CONNECTION_STRING: ${{ secrets.NEXT_PUBLIC_AZURE_MONITOR_CONNECTION_STRING }}
          NEXT_PUBLIC_AZURE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.NEXT_PUBLIC_AZURE_MONITOR_CONNECTION_STRING }}
          # OpenTelemetry configuration
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
          # Azure service endpoints (non-sensitive)
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_AISEARCH_ENDPOINT: ${{ vars.AZURE_AISEARCH_ENDPOINT }}
          AZURE_AISEARCH_DOCUMENTS_INDEX_NAME: ${{ vars.AZURE_AISEARCH_DOCUMENTS_INDEX_NAME }}
          AZURE_AISEARCH_POLICY_INDEX_NAME: ${{ vars.AZURE_AISEARCH_POLICY_INDEX_NAME }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          # Mem0 configuration
          MEM0_UI_HOST: ${{ vars.MEM0_UI_HOST }}
          MEM0_USERNAME: ${{ vars.MEM0_USERNAME }}
          MEM0_API_HOST: ${{ vars.MEM0_API_HOST }}
          # Google auth
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
        run: |
         node .yarn/releases/yarn-4.12.0.cjs workspace compliance-theater build:publish --filter="@compliance-theater/app..."
      
      - name: Copy built website to artifacts
        working-directory: ./        
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts/web-ui
          cp -r ./apps/web-ui/packages/app/.next $GITHUB_WORKSPACE/artifacts/web-ui/
          cp -r ./apps/web-ui/packages/app/public $GITHUB_WORKSPACE/artifacts/web-ui/

      - name: Upload website build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: web-ui
          path: $GITHUB_WORKSPACE/artifacts/web-ui

      - name: Validate Lighthouse scores and publish artifacts
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
     
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
